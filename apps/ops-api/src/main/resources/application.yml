spring:
  application:
    name: sentinelops-api
  datasource:
    url: ${SENTINELOPS_DB_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${SENTINELOPS_DB_USERNAME:sentinelops}
    password: ${SENTINELOPS_DB_PASSWORD:sentinelops}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      leak-detection-threshold: 10000
      data-source-properties:
        options: -c statement_timeout=5000
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SENTINELOPS_OIDC_JWK_SET_URI}

sentinelops:
  security:
    issuer: ${SENTINELOPS_OIDC_ISSUER}
    audience: sentinelops-api
    executor-audience: sentinelops-executor
  execution-ticket:
    issuer: urn:sentinelops:ops-api
    audience: sentinelops-executor

management:
  endpoint:
    health:
      probes:
        enabled: true
