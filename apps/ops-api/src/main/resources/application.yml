spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    tools:
      throw-exception-on-error: true
    chat:
      observations:
        log-prompt: false
        log-completion: false
  application:
    name: sentinelops-api
  datasource:
    url: ${SENTINELOPS_DB_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${SENTINELOPS_DB_USERNAME:sentinelops}
    password: ${SENTINELOPS_DB_PASSWORD:sentinelops}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      leak-detection-threshold: 10000
      data-source-properties:
        options: -c statement_timeout=5000
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SENTINELOPS_OIDC_JWK_SET_URI}
  data:
    redis:
      host: ${SENTINELOPS_VALKEY_HOST:localhost}
      port: ${SENTINELOPS_VALKEY_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

sentinelops:
  webhook:
    source-refs: ${SENTINELOPS_WEBHOOK_SOURCE_REFS:}
    nonce-cleanup-interval: PT1M
  evidence:
    mode: ${SENTINELOPS_EVIDENCE_MODE:fixture}
    prometheus:
      base-url: ${SENTINELOPS_PROMETHEUS_URL:}
    loki:
      base-url: ${SENTINELOPS_LOKI_URL:}
  ai:
    provider: ${SENTINELOPS_AI_PROVIDER:deterministic}
  security:
    issuer: ${SENTINELOPS_OIDC_ISSUER}
    audience: sentinelops-api
  execution-ticket:
    issuer: urn:sentinelops:ops-api
    audience: sentinelops-executor
  outbox:
    stream: sentinelops.executions
    relay-id: ${HOSTNAME:}
    relay-enabled: ${SENTINELOPS_OUTBOX_RELAY_ENABLED:true}
    relay-interval: 1s
    batch-size: 50
    max-error-length: 512
    retry-base-delay: 1s
    retry-max-delay: 5m
    max-publish-attempts: 20
  verification:
    scheduler-enabled: ${SENTINELOPS_VERIFICATION_ENABLED:true}
    worker-id: ${HOSTNAME:}
    poll-interval: 1s
    max-delay: 5s
    demo-checkout-base-url: ${SENTINELOPS_DEMO_SERVICE_URL:http://localhost:8082}

management:
  endpoint:
    health:
      probes:
        enabled: true
