spring:
  application:
    name: sentinelops-executor
  data:
    redis:
      host: ${SENTINELOPS_VALKEY_HOST:localhost}
      port: ${SENTINELOPS_VALKEY_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

sentinelops:
  executor:
    id: ${SENTINELOPS_EXECUTOR_ID:}
    enabled: ${SENTINELOPS_EXECUTOR_ENABLED:true}
    stream: sentinelops.executions
    consumer-group: ops-executors
    poll-interval: 500ms
    reclaim-idle: 35s
    heartbeat-interval: 10s
    batch-size: 10
  control-plane:
    base-url: ${SENTINELOPS_CONTROL_PLANE_URL:http://localhost:8080}
    audience: sentinelops-api
    jwks-cache-ttl: 5m
  oauth2:
    token-uri: ${SENTINELOPS_OAUTH2_TOKEN_URI}
    client-id: ${SENTINELOPS_EXECUTOR_CLIENT_ID}
    client-secret: ${SENTINELOPS_EXECUTOR_CLIENT_SECRET}
  execution-ticket:
    issuer: urn:sentinelops:ops-api
    audience: sentinelops-executor
  targets:
    demo-checkout:
      base-url: ${SENTINELOPS_DEMO_SERVICE_URL:http://localhost:8082}
      audience: demo-service
      scope: runbook:execute:checkout

management:
  endpoint:
    health:
      probes:
        enabled: true
