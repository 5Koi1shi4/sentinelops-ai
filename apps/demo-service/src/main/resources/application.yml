spring:
  application:
    name: sentinelops-demo-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SENTINELOPS_DEMO_JWKS_URI:http://localhost:8081/realms/sentinelops/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8082}

sentinelops:
  demo-mode: ${SENTINELOPS_DEMO_MODE:false}
  security:
    issuer: ${SENTINELOPS_DEMO_ISSUER:http://localhost:8081/realms/sentinelops}
    audience: demo-service

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,demoFault
