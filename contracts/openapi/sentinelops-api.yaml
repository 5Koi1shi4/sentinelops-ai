                  enum: [integer]
                minimum:
                  type: integer
                  minimum: 1
                  maximum: 1
                maximum:
                  type: integer
                  minimum: 1
                  maximum: 1
        required:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [replicas]
        additionalProperties:
          type: boolean
          enum: [false]

