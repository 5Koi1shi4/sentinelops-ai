openapi: 3.1.0
info:
  title: SentinelOps AI API
  version: 0.1.0-demo
  description: >-
    Service-scoped incident and Runbook API. Mutating operations are explicit,
    idempotent, version-checked, role-gated, and auditable.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Incidents
  - name: Diagnosis
  - name: Approvals
  - name: Executions
  - name: Integrations
  - name: Runbooks

paths:
  /incidents:
    get:
      operationId: listIncidents
      tags: [Incidents]
      summary: List service-scoped incidents
      x-required-roles: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: serviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/Severity"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A cursor-paginated incident page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /incidents/{incidentId}:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      operationId: getIncidentCockpit
      tags: [Incidents]
      summary: Get a sanitized incident cockpit projection
      description: >-
        Returns the latest bounded diagnosis, evidence metadata, active approval,
        and execution. Raw prompts, execution tickets, provider responses, and
        evidence bodies are deliberately excluded.
      x-required-roles: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
      responses:
        "200":
          description: Service-scoped incident cockpit.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCockpit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /incidents/{incidentId}/timeline:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      operationId: getIncidentTimeline
      tags: [Incidents]
      summary: Read the immutable incident event timeline
      x-required-roles: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A cursor-paginated event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentTimelinePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /incidents/{incidentId}/evidence:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      operationId: listIncidentEvidence
      tags: [Incidents]
      summary: Read separately authorized redacted evidence snapshots
      x-required-roles: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
      responses:
        "200":
          description: Redacted evidence snapshots.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/EvidenceSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /incidents/{incidentId}/diagnosis-runs:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: startDiagnosis
      tags: [Diagnosis]
      summary: Run an evidence-backed diagnosis
      x-required-roles: [ON_CALL_OPERATOR, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Diagnosis proposal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /incidents/{incidentId}/approval-requests:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: requestApproval
      tags: [Approvals]
      summary: Submit a diagnosed proposal for approval
      x-required-roles: [ON_CALL_OPERATOR, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApproval"
      responses:
        "201":
          description: Approval request created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /approval-requests/{requestId}/decisions:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideApproval
      tags: [Approvals]
      summary: Record an independent approval decision
      x-required-roles: [SRE_APPROVER, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionCommand"
      responses:
        "200":
          description: Decision recorded using server-confirmed state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /incidents/{incidentId}/executions:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: createExecution
      tags: [Executions]
      summary: Start an explicitly approved proposal
      x-required-roles: [ON_CALL_OPERATOR, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecution"
      responses:
        "201":
          description: Execution accepted for asynchronous dispatch.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /incidents/{incidentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: requestManualResolution
      tags: [Executions]
      summary: Request probe-backed manual resolution
      x-required-roles: [ON_CALL_OPERATOR, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "202":
          description: Verification cycle queued; the incident is not yet resolved.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /runbooks/search:
    get:
      operationId: searchRunbooks
      tags: [Runbooks]
      summary: Search published Runbook knowledge
      description: >-
        Searches only published, service-scoped Runbook chunks. The server owns
        the embedding input and enforces the result and candidate limits.
      x-required-roles: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Published, service-scoped knowledge hits.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/KnowledgeHit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /runbooks/{key}/versions:
    parameters:
      - $ref: "#/components/parameters/RunbookKey"
    get:
      operationId: listRunbookVersions
      tags: [Runbooks]
      summary: List Runbook versions
      description: >-
        Lists versions for a Runbook. Draft and administrative views are
        restricted to Runbook administrators and the service scope.
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - name: afterVersion
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Runbook versions ordered by version number.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/VersionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRunbookDraft
      tags: [Runbooks]
      summary: Create a Runbook draft
      description: >-
        Creates the stable Runbook identity when the key is absent, or verifies
        that the supplied service and owner metadata match the existing identity.
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "201":
          description: Runbook draft created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /runbook-versions/{id}:
    parameters:
      - $ref: "#/components/parameters/RunbookVersionId"
    get:
      operationId: getRunbookVersion
      tags: [Runbooks]
      summary: Get a Runbook version
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      responses:
        "200":
          description: Runbook version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRunbookDraft
      tags: [Runbooks]
      summary: Update a Runbook draft
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftContent"
      responses:
        "200":
          description: Updated Runbook draft.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /runbook-versions/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/RunbookVersionId"
    get:
      operationId: diffRunbookVersions
      tags: [Runbooks]
      summary: Compare two Runbook versions
      description: Both versions use one database snapshot. Versions belonging to different Runbooks return 409.
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - name: otherVersionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Structural Runbook version diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /runbook-versions/{id}/review:
    parameters:
      - $ref: "#/components/parameters/RunbookVersionId"
    post:
      operationId: reviewRunbookVersion
      tags: [Runbooks]
      summary: Review a Runbook draft
      description: A review is recorded for the authenticated administrator; no request body is accepted.
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reviewed Runbook draft.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /runbook-versions/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/RunbookVersionId"
    post:
      operationId: publishRunbookVersion
      tags: [Runbooks]
      summary: Publish a reviewed Runbook version
      description: Publishing freezes the definition and its indexed knowledge chunks.
      x-required-roles: [RUNBOOK_ADMIN, PLATFORM_ADMIN]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Immutable published Runbook version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /integrations/alertmanager/webhook:
    post:
      operationId: receiveAlertmanagerWebhook
      tags: [Integrations]
      summary: Ingest a validated Alertmanager v4 webhook
      description: >-
        Requires a bearer token with the sentinelops-api audience outside the Demo
        profile. The isolated Demo profile permits this private-network webhook
        without a user role.
      parameters:
        - name: X-SentinelOps-Source
          in: header
          schema:
            type: string
            default: alertmanager
        - name: X-SentinelOps-Event-Id
          in: header
          schema:
            type: string
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Alert accepted and deduplicated into an incident.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunbookKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    RunbookVersionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted resource revision from the most recent ETag.
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        example: '"7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200

  headers:
    ETag:
      description: Quoted resource revision for subsequent If-Match commands.
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        example: '"7"'

  responses:
    BadRequest:
      description: The request is malformed or contains invalid values.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: A valid bearer token is required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: The principal lacks the role or service scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: The command conflicts with the current workflow state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PreconditionFailed:
      description: The resource changed after the caller read it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    DependencyUnavailable:
      description: A required provider or dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    PlatformRole:
      type: string
      enum: [OBSERVER, ON_CALL_OPERATOR, SRE_APPROVER, RUNBOOK_ADMIN, PLATFORM_ADMIN]
    IncidentStatus:
      type: string
      enum:
        - DETECTED
        - TRIAGING
        - DIAGNOSED
        - AWAITING_APPROVAL
        - EXECUTING
        - VERIFYING
        - RESOLVED
        - SUPPRESSED
        - ESCALATED
    Severity:
      type: string
      enum: [sev1, sev2, sev3, sev4]
    RiskLevel:
      type: string
      enum: [R0, R1, R2, R3]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, INVALIDATED]
    ExecutionStatus:
      type: string
      enum: [PENDING, RUNNING, VERIFYING, SUCCEEDED, FAILED, UNKNOWN, ESCALATED]
    ApprovalDecision:
      type: string
      enum: [approve, reject]

    DraftInput:
      type: object
      additionalProperties: false
      required: [serviceId, displayName, ownerTeam, definition, markdown]
      properties:
        serviceId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        ownerTeam:
          type: string
          minLength: 1
          maxLength: 128
        definition:
          $ref: "#/components/schemas/RunbookDefinition"
        markdown:
          type: string
          minLength: 1
          maxLength: 120000

    DraftContent:
      type: object
      additionalProperties: false
      required: [definition, markdown]
      properties:
        definition:
          $ref: "#/components/schemas/RunbookDefinition"
        markdown:
          type: string
          minLength: 1
          maxLength: 120000

    RunbookDefinition:
      type: object
      additionalProperties: false
      description: >-
        The only definition shape currently supported by the executor. The
        server must also verify that runbookKey matches the URL and stable
        Runbook identity before accepting it.
      required: [runbookKey, risk, adapterId, parameters, steps, verification, rollback]
      properties:
        runbookKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        risk:
