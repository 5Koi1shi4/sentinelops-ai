global:
  resolve_timeout: 30s

route:
  receiver: sentinelops-ops-api
  group_by: [alertname, service_key, incident_fingerprint]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: sentinelops-ops-api
    webhook_configs:
      - url: http://demo-alert-relay:8082/internal/demo/alertmanager-relay
        send_resolved: true
        max_alerts: 20
