services:
  ops-api:
    environment:
      SENTINELOPS_WEBHOOK_SOURCE_REFS: demo-alertmanager=env:SENTINELOPS_WEBHOOK_DEMO_SECRET,load-test=env:SENTINELOPS_WEBHOOK_LOAD_SECRET,load-default=env:SENTINELOPS_WEBHOOK_DEFAULT_SECRET
      SENTINELOPS_WEBHOOK_LOAD_SECRET: ${SENTINELOPS_WEBHOOK_LOAD_SECRET:?Task7 load secret is required}
      SENTINELOPS_WEBHOOK_DEFAULT_SECRET: ${SENTINELOPS_WEBHOOK_DEFAULT_SECRET:?Task7 default-limit secret is required}
      SENTINELOPS_WEBHOOK_LOAD_TEST_LIMIT_PER_MINUTE: ${SENTINELOPS_TASK7_LOAD_LIMIT:-10000}
      SENTINELOPS_WEBHOOK_LOAD_TEST_BURST: ${SENTINELOPS_TASK7_LOAD_BURST:-200}
