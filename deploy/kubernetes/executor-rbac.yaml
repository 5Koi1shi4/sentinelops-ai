# 将 namespace、resourceNames 和 ServiceAccount 名称与只读目标目录保持一致。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelops-executor
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-executor-deployments
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout-api"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-executor-deployments
  namespace: production
subjects:
  - kind: ServiceAccount
    name: sentinelops-executor
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-executor-deployments
